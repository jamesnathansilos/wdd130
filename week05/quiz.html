<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <h1>HTML & CSS Quiz</h1>
    
    <form action="#" method="post">
        <label for="q1">1. What does HTML stand for?</label>
        <input type="text" name="q1" id="q1" placeholder="Enter your answer here">

        <label for="q2">2. What is the difference between margin and padding?</label>
        <textarea name="q2" id="q2" rows="4" placeholder="Enter your answer here"></textarea>
        
        <label for="q3">3. Which CSS property is used to change text color?</label>
        <select name="q3" id="q3">
            <option value="" selected disabled>Choose one...</option>
            <option value="color">color</option>
            <option value="font-color">font-color</option>
            <option value="text-color">text-color</option>
        </select>

        <label for="q4">4. How many heading tags exist in HTML</label>
        <input type="number" name="q4" id="q4" min="1" max="6" placeholder="Enter a number">

        <button type="submit">Submit Quiz</button>
    </form>
</body>
</html>
