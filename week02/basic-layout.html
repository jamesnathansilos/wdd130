<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="James Nathan Silos">
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="A logo of basic HTML structure" width="128"
          height="128">
    </header>
    <nav>
        <ul>
            <li><a href="https://churchofjesuschrist.org">The Church</a></li>
            <li><a href="https://google.com">Google</a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. In, impedit.</p>
        </section>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Ipsam, praesentium.</p>
        </section>
    </main>
    <aside>
        <img
          src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/oakland-california/800x500/01-Oakland-Temple-Exterior-2236889.jpg"
          alt="Oakland California Temple" width="200">
    </aside>
    <footer>
        <p>James Nathan Silos</p>
    </footer>
</body>


</html>
