<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="description" content="This page provides contact informations">
    <meta name="author" content="James Nathan Silos">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/z-dryoarlogo.png" alt="Rafting Logo">
        <div>
        </div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li> 
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact-section">
        <section class="contact-header">
            <h1>Dry Oar Rafting Company</h1>
            <address>
                123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@dryoar.com
            </address>
        </section>

        <section class="contact-container">

            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d179876.38379436216!2d-122.3460807649519!3d37.748856051237006!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sph!4v1770474795946!5m2!1sen!2sph" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Your full name" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <div class="radio-group">
                        <input type="radio" id="general" name="purpose">
                        <label for="general">General Inquiry</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="reservation" name="purpose">
                        <label for="reservation">Reservation Question</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="website" name="purpose">
                        <label for="website">Website Suggestion</label>
                    </div>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" rows="4" placeholder="Type your message here" required></textarea>

                <div class="checkbox-group">
                    <input type="checkbox" id="subscribe">
                    <label for="subscribe">Subscribe to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>
        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="team-cards">
                <div class="team-card">
                    <img src="images/amir.jpg" alt="Amir">
                    <h3>Amir</h3>
                    <p>Manager</p>
                </div>
                <div class="team-card">
                    <img src="images/gabby.jpg" alt="Gabby">
                    <h3>Gabby</h3>
                    <p>Supervisor</p>
                </div>
                <div class="team-card">
                    <img src="images/anas.jpg" alt="Anas">
                    <h3>Anas</h3>
                    <p>Employee</p>
                </div>
            </div>
        </section>
        
    </main>
    <footer>
        <p>&copy;2026 | Dry Oar Rafting | James Nathan Silos</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>
</html>
